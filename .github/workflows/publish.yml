name: publish

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks-gate:
    name: Wait for checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      conclusion: ${{ steps.gate.outputs.conclusion }}
    steps:
      - name: Get checks conclusion
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in $(seq 1 60); do
            status=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?branch=$REF_NAME&head_sha=${{ github.sha }}" --jq '.workflow_runs[0].status // "not_found"' 2>/dev/null || true)
            if [ "$status" = "completed" ]; then
              conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?branch=$REF_NAME&head_sha=${{ github.sha }}" --jq '.workflow_runs[0].conclusion // "unknown"' 2>/dev/null || true)
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::warning::Timed out waiting for checks to complete"
          echo "conclusion=timeout" >> "$GITHUB_OUTPUT"
          exit 1

  eligibility:
    needs: checks-gate
    if: ${{ github.repository == 'seedcord/seedcord' && (github.event_name == 'workflow_dispatch' || needs.checks-gate.outputs.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: gate
        uses: $/.github/actions/check-eligibility
        with:
          branch: ${{ github.ref_name }}

  npm-publish:
    needs: eligibility
    if: ${{ needs.eligibility.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs['published-packages'] }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Turbo cache
        uses: $/.github/actions/turbo-cache
        with:
          turbo_token: ${{ secrets.TURBO_TOKEN }}
          turbo_team: ${{ vars.TURBO_TEAM }}
      - name: Setup workspace
        uses: $/.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - name: Build prettier config dependency
        run: pnpm exec turbo run build --filter=@seedcord/eslint-config

      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm run release
          create-github-releases: false
          push-git-tags: false
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    needs: npm-publish
    if: ${{ needs.npm-publish.outputs.published == 'true' && github.ref_name == 'main' }}
    uses: $/.github/workflows/github-release.yml
    with:
      published: ${{ needs.npm-publish.outputs.publishedPackages }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  docs-publish:
    needs: npm-publish
    if: ${{ needs.npm-publish.outputs.published == 'true' }}
    uses: $/.github/workflows/docs-publish.yml
    with:
      published: ${{ needs.npm-publish.outputs.publishedPackages }}
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
