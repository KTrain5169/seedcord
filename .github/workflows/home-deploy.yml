name: home-deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/home/**'
      - 'tooling/ui/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/home-deploy.yml'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/site-deploy.yml
    with:
      app: home
      site_url: https://seedcord.org
    secrets: inherit
